name: Build & Release Linux ARM64 Natives

on:
  workflow_dispatch:
    inputs:
      imgui_java_version:
        description: 'imgui-java tag to build (e.g. v1.92.7.1)'
        required: true

permissions:
  contents: write

jobs:
  build-arm64:
    name: Build linux-arm64 libimgui-java64.so
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout SpaiR/imgui-java
        uses: actions/checkout@v4
        with:
          repository: SpaiR/imgui-java
          ref: ${{ inputs.imgui_java_version }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install compiler toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Java bindings & generate JNI headers
        run: ./gradlew :imgui-binding:compileJava

      # gdx-jnigen's GenerateLibs task always builds the Linux target as
      # Architecture.x86 (the newDefaultTarget(Os, Bitness) overload defaults
      # to x86), which bakes in x86-only flags (-mfpmath=sse -msse -m64) that
      # a native aarch64 g++ rejects outright. gdx-jnigen 2.5.2 already ships
      # a correct Linux ARM64 target (aarch64-linux-gnu- prefix, -fPIC, no SSE
      # flags) via newDefaultTarget(Os.Linux, Bitness._64, Architecture.ARM) —
      # imgui-java's build script just never selects it. Swap it in, and pin
      # the resulting file/folder names back to the "linux64" ones the rest
      # of GenerateLibs.groovy hardcodes downstream (checkLibExist, the
      # build-linux64.xml ant invocation), since Architecture.ARM otherwise
      # shifts them to "linuxarm64". Since this runner is natively aarch64
      # (not cross-compiling), the cross-toolchain compilerPrefix is cleared
      # so it invokes the system g++ directly.
      - name: Patch gdx-jnigen to target native ARM64 instead of x86
        run: |
          FILE=buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy

          OLD='BuildTarget.newDefaultTarget(Os.Linux, Architecture.Bitness._64)'
          NEW='BuildTarget.newDefaultTarget(Os.Linux, Architecture.Bitness._64, Architecture.ARM)'
          COUNT=$(grep -c -F "$OLD" "$FILE")
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one '$OLD' in $FILE, found $COUNT. imgui-java's GenerateLibs.groovy layout changed — update this patch step for ${{ inputs.imgui_java_version }}."
            exit 1
          fi
          sed -i "s|$OLD|$NEW|" "$FILE"

          ANCHOR='requireCpp17(linux64)'
          COUNT2=$(grep -c -F "$ANCHOR" "$FILE")
          if [ "$COUNT2" -ne 1 ]; then
            echo "::error::Expected exactly one '$ANCHOR' in $FILE, found $COUNT2. imgui-java's GenerateLibs.groovy layout changed — update this patch step for ${{ inputs.imgui_java_version }}."
            exit 1
          fi
          sed -i "/${ANCHOR}/a\\
            linux64.compilerPrefix = ''\\
            linux64.osFileName = 'linux64'\\
            linux64.libName = 'libimgui-java64.so'\\
            linux64.buildFileName = 'build-linux64.xml'" "$FILE"

          echo "--- Patched Linux build target block ---"
          grep -n -A6 'if (forLinux)' "$FILE"

      - name: Build native library
        run: ./gradlew :imgui-binding:generateLibs -Denvs=linux -Dlocal

      - name: Locate and verify output
        id: locate
        run: |
          SO_PATH=$(find . -name 'libimgui-java64.so' -path '*linux64*' | head -n1)
          if [ -z "$SO_PATH" ]; then
            echo "libimgui-java64.so not found under any linux64 build output directory" >&2
            find . -name 'libimgui-java64.so' >&2 || true
            exit 1
          fi
          file "$SO_PATH" | tee /dev/stderr | grep -q 'ARM aarch64' || {
            echo "Output is not an ARM64 ELF binary" >&2
            exit 1
          }
          mkdir -p dist
          cp "$SO_PATH" "dist/libimgui-java64-linux-arm64-${{ inputs.imgui_java_version }}.so"
          echo "asset=dist/libimgui-java64-linux-arm64-${{ inputs.imgui_java_version }}.so" >> "$GITHUB_OUTPUT"

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.imgui_java_version }}
          name: imgui-java ${{ inputs.imgui_java_version }} — linux-arm64
          body: |
            Native `libimgui-java64.so` for `io.github.spair:imgui-java` `${{ inputs.imgui_java_version }}`,
            cross-compiled on a native `ubuntu-24.04-arm` GitHub-hosted runner.

            Upstream does not publish Linux ARM64 natives (see
            [SpaiR/imgui-java#105](https://github.com/SpaiR/imgui-java/issues/105)).
            See this repo's README for integration instructions.
          files: ${{ steps.locate.outputs.asset }}
